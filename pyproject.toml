[build-system]
requires = ["setuptools==78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "m32-fx-reconciler"
version = "0.1.0"
description = "Exact FX input validation (M1)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.optional-dependencies]
test = ["setuptools==78.1.1", "pytest==9.0.2", "iniconfig==2.3.0", "packaging==25.0", "pluggy==1.6.0", "Pygments==2.19.2", "colorama==0.4.6; sys_platform == 'win32'"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fx_reconciler"]

[tool.setuptools]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --basetemp=.pytest-tmp"
